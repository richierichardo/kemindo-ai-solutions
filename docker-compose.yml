services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kemindo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kemindo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "55432:5432"
    volumes:
      - kemindo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kemindo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kemindo-postgres-data:
